<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive, procedurally built 3D miniature of Marina Bay, Singapore, rendered with three.js.">
<title>Singapore in Miniature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D canvas; ivory-glass controls float at the corners; the landmark card docks right on desktop and becomes a bottom sheet on phones. */
:root {
  --bg: #E7DECC;
  --paper: rgba(251, 247, 239, 0.88);
  --paper-solid: #FBF7EF;
  --ink: #1B2A2C;
  --muted: #56645F;
  --line: rgba(27, 42, 44, 0.14);
  --accent: #0C7A74;
  --accent-ink: #FFFFFF;
  --sun: #D9673A;
  --focus: #0B6E69;
  --label-bg: rgba(251, 247, 239, 0.94);
  --label-ink: #1B2A2C;
  --shadow: 0 10px 30px rgba(52, 38, 18, 0.16), 0 1px 2px rgba(52, 38, 18, 0.10);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --top: calc(env(safe-area-inset-top, 0px) + 14px);
  --bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  --dock-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1316; --paper: rgba(15, 26, 30, 0.86); --paper-solid: #111D21; --ink: #ECF1EA; --muted: #A2B3AD;
    --line: rgba(236, 241, 234, 0.15); --accent: #4CC9BC; --accent-ink: #062320; --sun: #F28C5F; --focus: #7FE0D5;
    --label-bg: rgba(15, 26, 30, 0.92); --label-ink: #ECF1EA; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1316; --paper: rgba(15, 26, 30, 0.86); --paper-solid: #111D21; --ink: #ECF1EA; --muted: #A2B3AD;
  --line: rgba(236, 241, 234, 0.15); --accent: #4CC9BC; --accent-ink: #062320; --sun: #F28C5F; --focus: #7FE0D5;
  --label-bg: rgba(15, 26, 30, 0.92); --label-ink: #ECF1EA; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 30%, var(--paper-solid), var(--bg)); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
#scene:active { cursor: grabbing; }
#scene:focus-visible { box-shadow: inset 0 0 0 3px var(--focus); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.glass { background: var(--paper); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); box-shadow: var(--shadow); border: 1px solid var(--line); }

/* Top row */
.top { position: absolute; top: var(--top); left: var(--gutter-l); right: var(--gutter-r); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; pointer-events: none; }
.top > * { pointer-events: auto; }
.titleblock { padding: 10px 14px 11px; border-radius: 12px; display: grid; gap: 2px; max-width: 320px; }
.titleblock .coords { margin: 0; font: 500 10.5px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.titleblock h1 { margin: 0; font: 700 19px/1.15 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.titleblock .sub { margin: 0; font-size: 12px; color: var(--muted); }

.tod { display: flex; padding: 4px; border-radius: 999px; gap: 2px; }
.tod button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 7px 13px 7px 10px; min-height: 36px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s; }
.tod button svg { width: 16px; height: 16px; flex: none; }
.tod button:hover { color: var(--ink); }
.tod button[aria-pressed="true"] { background: var(--ink); color: var(--paper-solid); }

/* Bottom area */
.bottom { position: absolute; left: var(--gutter-l); right: var(--gutter-r); bottom: var(--bottom); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.dock { display: flex; gap: 6px; padding: 6px; border-radius: 999px; flex-wrap: wrap; justify-content: center; }
.dock button { border: 0; background: transparent; min-height: 40px; padding: 8px 15px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; transition: background .2s, color .2s; }
.dock button:hover { background: var(--line); }
.dock button svg { width: 16px; height: 16px; flex: none; }
.dock button.primary { background: var(--accent); color: var(--accent-ink); }
.dock button.primary:hover { filter: brightness(1.06); }
.dock button[aria-pressed="true"], .dock button[aria-expanded="true"] { background: var(--ink); color: var(--paper-solid); }

.hint { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px; border-radius: 999px; font-size: 13px; color: var(--ink); max-width: 100%; }
.hint p { margin: 0; }
.hint kbd { font: 500 11px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); }
.icon-btn { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--line); color: var(--ink); }
.icon-btn svg { width: 14px; height: 14px; }

.lm-panel { position: absolute; bottom: calc(var(--dock-h) + 10px); left: 50%; transform: translateX(-50%); width: min(360px, 100%); border-radius: 16px; padding: 12px; }
.lm-panel h2 { margin: 2px 6px 8px; font: 500 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.lm-panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: min(52vh, 420px); overflow: auto; }
.lm-panel li button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 9px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.lm-panel li button:hover { background: var(--line); }
.lm-panel li button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.lm-panel li button[aria-current="true"] .lm-district { color: inherit; opacity: .8; }
.lm-name { font-weight: 600; font-size: 14.5px; }
.lm-district { font: 400 11px var(--mono); color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; }

/* Landmark card */
.card { position: absolute; top: calc(var(--top) + 64px); right: var(--gutter-r); width: 360px; max-height: calc(100% - var(--top) - var(--bottom) - var(--dock-h) - 90px); overflow: auto; border-radius: 18px; padding: 20px 20px 18px; display: grid; gap: 10px; outline: none; }
.card:focus-visible { outline: 2px solid var(--focus); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-eyebrow { margin: 0; font: 500 11px/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--sun); }
.card h2 { margin: 2px 0 0; font: 700 26px/1.08 var(--display); letter-spacing: -0.015em; text-wrap: balance; }
.card p.desc { margin: 0; font-size: 15px; line-height: 1.55; }
.card .look { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--line); font-size: 13.5px; line-height: 1.5; }
.card .look strong { font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; display: block; color: var(--muted); margin-bottom: 2px; }
.card-tour { display: grid; gap: 6px; }
.card-tour span { font: 500 11px var(--mono); letter-spacing: 0.06em; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0%; background: var(--accent); }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.btn { border: 1px solid var(--line); background: transparent; min-height: 40px; padding: 8px 15px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; }
.btn:hover { background: var(--line); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }

/* Labels anchored to landmarks */
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.label { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--label-bg); color: var(--label-ink); font: 600 12px/1.1 var(--body); white-space: nowrap; box-shadow: var(--shadow); pointer-events: auto; cursor: pointer; transition: opacity .25s, background-color .2s, color .2s; will-change: transform; user-select: none; -webkit-user-select: none; }
.label::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 9px; margin-left: -0.75px; background: var(--label-bg); }
.label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sun); flex: none; }
.label.is-hidden { opacity: 0; pointer-events: none; }
.label.is-hot, .label.is-active { background: var(--accent); color: var(--accent-ink); }
.label.is-hot::after, .label.is-active::after { background: var(--accent); }
.label.is-hot .dot, .label.is-active .dot { background: var(--accent-ink); }

/* Loading and failure */
.overlay { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; padding: 24px var(--gutter-r) 24px var(--gutter-l); background: radial-gradient(120% 90% at 50% 30%, var(--paper-solid), var(--bg)); transition: opacity .6s ease; }
.overlay.done { opacity: 0; pointer-events: none; }
.overlay p { margin: 0; color: var(--muted); font-size: 14px; max-width: 46ch; line-height: 1.5; }
.overlay h2 { margin: 0; font: 700 24px/1.15 var(--display); }
.loader-mark { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 1.1s linear infinite; position: relative; }
.loader-mark::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; border: 2px dashed var(--line); }
@keyframes spin { to { transform: rotate(360deg); } }
.fail { z-index: 4; }
.fail .btn { margin-top: 4px; }

@media (max-width: 720px) {
  .titleblock { padding: 8px 12px 9px; }
  .titleblock h1 { font-size: 16px; }
  .titleblock .sub { display: none; }
  .tod button { padding: 6px 10px 6px 8px; font-size: 12.5px; }
  .card { top: auto; left: var(--gutter-l); right: var(--gutter-r); width: auto; bottom: calc(var(--bottom) + var(--dock-h) + 10px); max-height: min(46vh, 420px); padding: 16px 16px 14px; gap: 8px; }
  .card h2 { font-size: 22px; }
  .card p.desc { font-size: 14px; line-height: 1.5; }
  .card .look { font-size: 13px; }
  .label { font-size: 11px; padding: 4px 8px 4px 7px; }
  .dock button { padding: 8px 11px; font-size: 13px; }
  .hint { font-size: 12px; }
}
@media (max-width: 480px) {
  .dock { flex-wrap: nowrap; gap: 2px; }
  .dock button { padding: 8px 10px; }
  .dock button .lbl-long { display: none; }
  #btn-motion > span { display: none; }
  #btn-motion { width: 40px; padding: 0; justify-content: center; }
}
#app.card-open .hint { display: none; }
.lbl-short { display: none; }
@media (max-width: 480px) { .dock button .lbl-short { display: inline; } }
@media (prefers-reduced-motion: reduce) {
  .loader-mark { animation: none; }
  .overlay, .label { transition: none; }
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <canvas id="scene" tabindex="0" aria-label="3D model of Marina Bay, Singapore. Arrow keys pan, plus and minus zoom. Use the Landmarks list to visit each landmark."></canvas>
  <div id="labels" aria-hidden="true"></div>

  <div class="top">
    <header class="titleblock glass">
      <p class="coords">1.28° N · 103.86° E</p>
      <h1>Singapore, in miniature</h1>
      <p class="sub">Marina Bay · stylized model, not to scale</p>
    </header>
    <div class="tod glass" role="group" aria-label="Time of day" id="tod">
      <button type="button" data-tod="day" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke-linecap="round"/></svg>
        Day
      </button>
      <button type="button" data-tod="sunset" aria-pressed="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4.5 11a3.5 3.5 0 0 1 7 0" /><path d="M1.5 11h13M3.5 13.5h9M8 3v2.2M3 6l1.3 1.1M13 6l-1.3 1.1" stroke-linecap="round"/></svg>
        Sunset
      </button>
      <button type="button" data-tod="night" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12.8 10.2A5.3 5.3 0 0 1 5.8 3.2a5.3 5.3 0 1 0 7 7Z" stroke-linejoin="round"/></svg>
        Night
      </button>
    </div>
  </div>

  <aside id="card" class="card glass" hidden aria-labelledby="card-title" tabindex="-1">
    <div class="card-head">
      <div>
        <p class="card-eyebrow" id="card-district"></p>
        <h2 id="card-title"></h2>
      </div>
    </div>
    <p class="desc" id="card-desc"></p>
    <p class="look" id="card-look"></p>
    <div class="card-tour" id="card-tour" hidden>
      <span id="card-step"></span>
      <div class="progress" aria-hidden="true"><i id="card-progress"></i></div>
    </div>
    <div class="card-actions">
      <button type="button" class="btn primary" id="card-back">Back to city</button>
      <button type="button" class="btn" id="card-next" hidden>Next stop</button>
      <button type="button" class="btn" id="card-end" hidden>End tour</button>
    </div>
  </aside>

  <div class="bottom" id="bottom">
    <div class="hint glass" id="hint" hidden>
      <p id="hint-text"></p>
      <button type="button" class="icon-btn" id="hint-close" aria-label="Dismiss controls hint">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="lm-panel glass" id="lm-panel" hidden>
      <h2 id="lm-heading">Landmarks</h2>
      <ul id="lm-list" aria-labelledby="lm-heading"></ul>
    </div>
    <nav class="dock glass" id="dock" aria-label="Model controls">
      <button type="button" id="btn-landmarks" aria-expanded="false" aria-controls="lm-panel">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 14.5s4.5-4.2 4.5-8a4.5 4.5 0 0 0-9 0c0 3.8 4.5 8 4.5 8Z" stroke-linejoin="round"/><circle cx="8" cy="6.5" r="1.6"/></svg>
        Landmarks
      </button>
      <button type="button" id="btn-tour" class="primary" data-needs-3d>
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" id="tour-icon"><path d="M5 3.2v9.6L12.5 8 5 3.2Z"/></svg>
        <span id="tour-label"><span class="lbl-long">Guided tour</span><span class="lbl-short">Tour</span></span>
      </button>
      <button type="button" id="btn-reset" data-needs-3d>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.8 8a5.2 5.2 0 1 0 1.6-3.8" stroke-linecap="round"/><path d="M2.5 2.2v3h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Reset<span class="lbl-long"> view</span></span>
      </button>
      <button type="button" id="btn-motion" aria-pressed="false" aria-label="Reduce motion" data-needs-3d>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 8h3l1.5-3 3 6L11 8h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span><span class="lbl-long">Reduce </span>motion</span>
      </button>
    </nav>
  </div>

  <div id="live" class="sr-only" aria-live="polite"></div>

  <div id="loader" class="overlay" role="status">
    <div class="loader-mark" aria-hidden="true"></div>
    <p id="loader-text">Loading the 3D engine…</p>
  </div>
  <div id="fail" class="overlay fail" hidden role="alert">
    <h2 id="fail-title">The 3D model can’t be shown</h2>
    <p id="fail-msg"></p>
    <button type="button" class="btn primary" id="fail-browse">Browse the landmarks</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* ------------------------------------------------------------------ */
/* Content                                                             */
/* ------------------------------------------------------------------ */
const LANDMARKS = [
  {
    id: 'mbs', name: 'Marina Bay Sands', district: 'Bayfront',
    desc: 'An integrated resort designed by architect Moshe Safdie that opened in 2010. Its three hotel towers are joined at the top by the SkyPark, a long platform with gardens and an infinity pool that cantilevers out beyond the northern tower.',
    look: 'The boat-shaped SkyPark spans all three towers. Each tower stands on two legs, one of them curving in to meet the other.'
  },
  {
    id: 'gardens', name: 'Gardens by the Bay', district: 'Marina South',
    desc: 'A garden park on reclaimed land beside the bay, opened in 2012. Its Supertrees are vertical gardens of ferns, climbers and orchids on steel frames, and they light up each evening. Two cooled glass conservatories, the Flower Dome and the Cloud Forest, recreate cool-dry and cool-moist mountain climates.',
    look: 'Switch to night to see the Supertree canopies glow. The taller dome hides a planted mountain with a waterfall.'
  },
  {
    id: 'flyer', name: 'Singapore Flyer', district: 'Marina Centre',
    desc: 'A giant observation wheel that opened in 2008. Riders travel in enclosed, air-conditioned capsules mounted on the outside of the rim, looking out over the bay, the city and the Singapore Strait.',
    look: 'The wheel turns slowly as you watch. Its rim lights up after dark.'
  },
  {
    id: 'merlion', name: 'Merlion', district: 'Merlion Park',
    desc: 'Singapore’s mascot, with the head of a lion and the body of a fish. The lion recalls the city’s old name, Singapura, or “lion city”, and the fish its beginnings as a fishing village. The statue was unveiled in 1972 and now stands near the mouth of the Singapore River, facing east across the bay.',
    look: 'Follow the arc of water from its mouth out into the bay.'
  },
  {
    id: 'artscience', name: 'ArtScience Museum', district: 'Bayfront',
    desc: 'A museum about where art, science, culture and technology meet. It opened in 2011 as part of Marina Bay Sands and was also designed by Moshe Safdie. Its lotus-like form rises from a lily pond, and its dished roof gathers rainwater and channels it down through the middle of the building.',
    look: 'Ten petal-like “fingers” open toward the water, each a different height.'
  },
  {
    id: 'helix', name: 'Helix Bridge', district: 'Marina Bay',
    desc: 'A curved pedestrian bridge linking Marina Centre with the Bayfront, opened in 2010. Its steel structure is modelled on the double helix of DNA, and at night lights pick out the letters c, g, a and t, the four bases of DNA.',
    look: 'Two tubes spiral around the walkway. At night they sparkle red and green.'
  },
  {
    id: 'skyline', name: 'Downtown Core', district: 'Raffles Place',
    desc: 'Singapore’s central business district. Banks and offices have clustered around Raffles Place since colonial times, and the newer towers of Marina Bay Financial Centre stand on land reclaimed from the sea along the bay.',
    look: 'Every tower here is generated, but no two share a silhouette: stepped, octagonal, round, tapered and slant-topped.'
  },
  {
    id: 'esplanade', name: 'Esplanade', district: 'Civic District',
    desc: 'Esplanade – Theatres on the Bay is a performing arts centre that opened in 2002. Its two domes are clad in angled sunshades, which earned the building the local nickname “the durian”.',
    look: 'The bigger dome holds the theatre and the smaller one the concert hall.'
  }
];
const TOUR = ['mbs', 'artscience', 'helix', 'flyer', 'gardens', 'merlion', 'skyline', 'esplanade'];
const LM = Object.fromEntries(LANDMARKS.map(l => [l.id, l]));
const HOLD_SECONDS = 7;

/* ------------------------------------------------------------------ */
/* DOM + UI state (works with or without WebGL)                        */
/* ------------------------------------------------------------------ */
const $ = (s) => document.querySelector(s);
const ui = {
  app: $('#app'), canvas: $('#scene'), labels: $('#labels'), card: $('#card'), cardDistrict: $('#card-district'),
  cardTitle: $('#card-title'), cardDesc: $('#card-desc'), cardLook: $('#card-look'), cardTour: $('#card-tour'),
  cardStep: $('#card-step'), cardProgress: $('#card-progress'), cardBack: $('#card-back'), cardNext: $('#card-next'),
  cardEnd: $('#card-end'), hint: $('#hint'), hintText: $('#hint-text'), hintClose: $('#hint-close'),

  tourLabel: $('#tour-label'), tourIcon: $('#tour-icon'), btnReset: $('#btn-reset'), btnMotion: $('#btn-motion'),

  } catch (err) {
    console.error(err);
    fail('The 3D engine didn’t load', 'three.js could not be downloaded from the jsDelivr CDN. Check your connection and reload the page. You can still read about every landmark.');
    return;
  }
  ui.loaderText.textContent = 'Building the bay…';
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

    state.engine = createEngine();
  } catch (err) {

    const lm = track(new THREE.PointsMaterial({ map: glowTex, color: 0xFFE2A8, size: 1.8, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));

  /* ---------------- Highlight ring + labels ---------------- */
  const ringMat = basic({ color: '#FF8A55', transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 });
  const ring = new THREE.Mesh(track(new THREE.RingGeometry(0.93, 1, 96).rotateX(-Math.PI / 2)), ringMat);
  ring.renderOrder = 2; scene.add(ring);

  const labelEls = {};
  for (const lm of LANDMARKS) {
    const el = document.createElement('div'); el.className = 'label is-hidden'; el.dataset.id = lm.id;
    el.innerHTML = '<span class="dot"></span><span></span>'; el.lastChild.textContent = lm.name;
    el.addEventListener('click', () => { closePanel(); selectLandmark(lm.id); }, sig);

  /* ---------------- Time of day ---------------- */

  const PRESETS = {
    day: { skyTop: '#4F9AD4', skyHorizon: '#D3E7EC', skyBottom: '#E2DDCC', sunColor: '#FFF3DC', sunInt: 2.9, sunDir: n3(0.42, 0.9, 0.5), hemiSky: '#D7ECFF', hemiGround: '#C8B48E', hemiInt: 1.15, exposure: 1.0, fog: '#D5E5E8', fogNear: 260, fogFar: 1100, waterDeep: '#0A7889', waterShallow: '#37CCC0', glass: '#B4C6CB', cityGlow: '#000000', lit: 0, glow: 0, stars: 0, spec: 0.3, sunGlow: 0.6, disk: 0.7 },
    sunset: { skyTop: '#4A5A95', skyHorizon: '#F7BE8C', skyBottom: '#EEC6A6', sunColor: '#FFC08A', sunInt: 2.9, sunDir: n3(-0.92, 0.3, -0.26), hemiSky: '#F7DCC5', hemiGround: '#8EA9A6', hemiInt: 1.05, exposure: 1.08, fog: '#F0C6A6', fogNear: 220, fogFar: 1000, waterDeep: '#0C7286', waterShallow: '#40C8BD', glass: '#E6B587', cityGlow: '#FFB070', lit: 0.25, glow: 0.3, stars: 0, spec: 1.6, sunGlow: 1.1, disk: 1.0 },
    night: { skyTop: '#060B1C', skyHorizon: '#283255', skyBottom: '#0B1120', sunColor: '#A9C0FF', sunInt: 0.55, sunDir: n3(0.5, 0.75, -0.42), hemiSky: '#34466C', hemiGround: '#1B1F28', hemiInt: 0.6, exposure: 1.15, fog: '#1B2442', fogNear: 170, fogFar: 850, waterDeep: '#05223A', waterShallow: '#0E4E5E', glass: '#18232D', cityGlow: '#FFB46A', lit: 1, glow: 1, stars: 1, spec: 0.5, sunGlow: 0.35, disk: 0.55 }
  };
  const COLOR_KEYS = ['skyTop', 'skyHorizon', 'skyBottom', 'sunColor', 'hemiSky', 'hemiGround', 'fog', 'waterDeep', 'waterShallow', 'glass', 'cityGlow'];

  const toEnv = (p) => { const e = {}; for (const k of COLOR_KEYS) e[k] = C(p[k]); for (const k of NUM_KEYS) e[k] = p[k]; e.sunDir = p.sunDir.clone(); return e; };
  const ENVS = Object.fromEntries(Object.entries(PRESETS).map(([k, v]) => [k, toEnv(v)]));

  let envFrom = null, envTo = null, envT = 1;

  function applyEnv() {

    sun.color.copy(env.sunColor); sun.intensity = env.sunInt; sun.position.copy(env.sunDir).multiplyScalar(300);

    w.uDeep.value.copy(env.waterDeep); w.uShallow.value.copy(env.waterShallow); w.uSky.value.copy(env.skyHorizon).lerp(env.skyTop, 0.25);
    w.uSunDir.value.copy(env.sunDir); w.uSunCol.value.copy(env.sunColor); w.uSpec.value = env.spec; w.uGlow.value.copy(env.cityGlow); w.uNight.value = env.lit;

  }
  function setTime(mode) {
    envFrom = { ...env, sunDir: env.sunDir.clone() }; for (const k of COLOR_KEYS) envFrom[k] = env[k].clone();
    envTo = ENVS[mode]; envT = state.reduced ? 1 : 0;
    if (envT === 1) { mixEnv(envFrom, envTo, 1); applyEnv(); }
  }
  applyEnv();

  /* ---------------- Camera views ---------------- */
  const DEFAULT = { t: [10, 0, 32], az: -136, el: 35, d: 222 };
  let W = 1, H = 1;
  function fit(isDefault) { const a = W / H; if (isDefault) return a >= 1.3 ? 1 : Math.min(1.75, Math.pow(1.3 / a, 0.7)); return a >= 1 ? 1 : Math.min(1.6, Math.pow(1 / a, 0.6)); }
  function viewFor(v, isDefault) {
    const a = W / H, lift = isDefault && a < 1 ? (1 - a) * 30 : 0;
    const t = new V3(...v.t), d = v.d * fit(isDefault), az = v.az * DEG, el = (v.el + lift) * DEG;
    return { target: t, position: t.clone().add(new V3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).multiplyScalar(d)) };
  }
  let tween = null;
  function settleControls() { const d = controls.enableDamping; controls.enableDamping = false; controls.update(); controls.enableDamping = d; }
  function flyTo(view, onArrive) {
    settleControls();
    controls.autoRotate = false;
    const p0 = camera.position.clone(), t0 = controls.target.clone();
    if (state.reduced) {
      controls.target.copy(view.target); camera.position.copy(view.position); settleControls(); tween = null; onArrive && onArrive(); return;
    }
    const s0 = new THREE.Spherical().setFromVector3(p0.clone().sub(t0)), s1 = new THREE.Spherical().setFromVector3(view.position.clone().sub(view.target));
    let dTh = s1.theta - s0.theta; while (dTh > Math.PI) dTh -= Math.PI * 2; while (dTh < -Math.PI) dTh += Math.PI * 2;
    const travel = t0.distanceTo(view.target) + Math.abs(s1.radius - s0.radius) * 0.5 + Math.abs(dTh) * 30;
    tween = { t0, t1: view.target.clone(), s0, s1, dTh, k: 0, dur: Math.min(2.8, Math.max(1.3, 1.1 + travel / 120)), lift: Math.min(0.3, travel / 500), onArrive };
  }
  const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const sph = new THREE.Spherical();
  function stepTween(dt) {
    if (!tween) return;
    tween.k = Math.min(1, tween.k + dt / tween.dur);
    const e = ease(tween.k), arcK = Math.sin(Math.PI * e);

    sph.radius = (tween.s0.radius + (tween.s1.radius - tween.s0.radius) * e) * (1 + tween.lift * arcK);
    sph.phi = Math.max(0.15, tween.s0.phi + (tween.s1.phi - tween.s0.phi) * e - tween.lift * 0.6 * arcK);
    sph.theta = tween.s0.theta + tween.dTh * e;

    camera.lookAt(controls.target);

  }

  /* ---------------- Interaction ---------------- */
  const raycaster = new THREE.Raycaster();
  const occluders = [...landMeshes, ...cityMeshes.filter(m => !m.userData.lm)];
  const pickSet = [...pickMeshes, ...occluders];
  const ndc = new THREE.Vector2();
  function pickAt(cx, cy) {
    const r = canvas.getBoundingClientRect();
    ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(pickSet, false)[0];
    return hit ? hit.object.userData.lm || null : null;
  }
  const hover = { id: null, label: null, dirty: false, x: 0, y: 0, mouse: false };
  const ptr = { active: new Map(), multi: false, start: null };
  canvas.addEventListener('pointerdown', (e) => {
    ptr.active.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptr.active.size > 1) ptr.multi = true;
    if (ptr.active.size === 1) { ptr.multi = false; ptr.start = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false, id: e.pointerId }; }
  }, sig);
  canvas.addEventListener('pointermove', (e) => {
    hover.x = e.clientX; hover.y = e.clientY; hover.mouse = e.pointerType === 'mouse'; hover.dirty = true;
    const s = ptr.start; if (s && s.id === e.pointerId && Math.hypot(e.clientX - s.x, e.clientY - s.y) > 6) s.moved = true;
  }, sig);
  const endPtr = (e, cancel) => {
    ptr.active.delete(e.pointerId);
    const s = ptr.start;
    if (!s || s.id !== e.pointerId) return;
    ptr.start = null;
    if (cancel || ptr.multi || s.moved || performance.now() - s.t > 650) return;
    const id = pickAt(e.clientX, e.clientY);
    if (id) { closePanel(); selectLandmark(id); }
  };
  canvas.addEventListener('pointerup', (e) => endPtr(e, false), sig);
  canvas.addEventListener('pointercancel', (e) => endPtr(e, true), sig);
  canvas.addEventListener('pointerleave', () => { hover.mouse = false; hover.dirty = true; }, sig);
  controls.addEventListener('start', () => { if (state.tour) stopTour(); if (tween) { tween = null; settleControls(); } });
  canvas.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', '+', '=', '-', '_'].includes(e.key)) { if (state.tour) stopTour(); }

  }, sig);

  /* ---------------- Resize + view offset for the card ---------------- */
  const shift = { x: 0, y: 0 };
  const uiObstacles = [ui.card, ui.dock, ui.tod, ui.hint, ui.lmPanel, document.querySelector('.titleblock')];
  function resize() {
    const r = ui.app.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);
    renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
    for (const l of Object.values(labelEls)) { l.w = l.el.offsetWidth; l.h = l.el.offsetHeight; }
    applyShift(true);
  }
  function targetShift() {
    if (ui.card.hidden) return { x: 0, y: 0 };
    const r = ui.card.getBoundingClientRect();
    if (W > 720) return { x: Math.min(r.width / 2 + 8, W * 0.25), y: 0 };

  const proj = new V3();
  function updateLabels() {
    const order = [];

    const placed = [];

    for (const id of order) {

      const rect = { l: x - L.w / 2 - 4, r: x + L.w / 2 + 4, t: y - L.h - 12, b: y };

      if (show && tween && id !== state.selected) show = false;
      if (show) for (const p of placed) if (rect.l < p.r && rect.r > p.l && rect.t < p.b && rect.b > p.t) { show = false; break; }
      if (show) placed.push(rect);
      if (show) {
        if (Math.abs(L.x - x) > 0.3 || Math.abs(L.y - y) > 0.3) { L.el.style.transform = `translate(${(x - L.w / 2).toFixed(1)}px, ${(y - L.h - 10).toFixed(1)}px)`; L.x = x; L.y = y; }
      }
      if (show !== L.shown) { L.el.classList.toggle('is-hidden', !show); L.shown = show; }
      L.el.classList.toggle('is-active', id === state.selected);
      L.el.classList.toggle('is-hot', id === hover.id && id !== state.selected);
    }
  }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    const amb = state.reduced ? 0 : 1;
    time += dt;

    if (envT < 1) { envT = Math.min(1, envT + dt / 1.4); mixEnv(envFrom, envTo, ease(envT)); applyEnv(); }

    stepTween(dt);
    if (!tween) { controls.update(dt); }
    // keep the camera over the model
    const t = controls.target;
    const cx = THREE.MathUtils.clamp(t.x, -118, 118), cz = THREE.MathUtils.clamp(t.z, -100, 100), cy = THREE.MathUtils.clamp(t.y, 0, 25);

    waterMat.uniforms.uTime.value += dt * (state.reduced ? 0.25 : 1);
    if (flyer.wheel) flyer.wheel.rotation.z += dt * 0.06 * amb;

      b.u = (b.u + dt * amb * b.curve.speed / b.curve.len) % 1;
      const p = b.curve.c.getPointAt(b.u), tg = b.curve.c.getTangentAt(b.u);
      b.g.position.set(p.x, 0.02 + Math.sin(time * 2 + b.bob) * 0.04 * amb, p.z);
      b.g.rotation.y = Math.atan2(-tg.z, tg.x);

    }
    { const a = boats.lights.geometry.attributes.position; boats.forEach((b, i) => a.setXYZ(i, b.g.position.x, 1.2, b.g.position.z)); a.needsUpdate = true; }
    {
      const a = spout.points.geometry.attributes.position, sp = state.reduced ? 0.35 : 1;

      const g = supertrees.glow;
      const hc = supertrees.halo.geometry.attributes.color;

    if (hover.dirty) {
      hover.dirty = false;
      hover.id = (hover.mouse && !ptr.start && !tween) ? pickAt(hover.x, hover.y) : null;
    }
    const hot = hover.label || hover.id;
    canvas.style.cursor = hot ? 'pointer' : '';

    // emissive night lighting + highlight
    const pulse = 0.5 + 0.5 * Math.sin(time * 4);
    for (const m of glowList) {
      const lm = m.userData.lm;
      const h = lm && lm === hot ? 0.14 + 0.08 * pulse * amb : 0;
      m.emissive.copy(m.userData.night).multiplyScalar(m.userData.k * env.glow * env.glow).add(tmpC.copy(HL).multiplyScalar(h));
    }
    const ringId = hot || state.selected;
    if (ringId) {
      const r = lmData[ringId].ring; ring.position.set(r.x, r.y + 0.06, r.z); ring.scale.setScalar(r.r);
      ringMat.opacity = hot ? 0.55 + 0.3 * pulse * amb : 0.5;
    } else ringMat.opacity = 0;

    renderer.render(scene, camera);

      ui.loader.classList.add('done');
      setTimeout(() => { ui.loader.hidden = true; }, 650);
    }
  }

  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault(); cancelAnimationFrame(raf);
    fail('The graphics context was lost', 'Your device paused the 3D view, often to save memory. Reload the page to bring the model back. You can still read about every landmark.');
  }, sig);

  resize();
  const start = viewFor(DEFAULT, true);
  controls.target.copy(start.target); camera.position.copy(start.position); settleControls();
  const measureLabels = () => { for (const l of Object.values(labelEls)) { l.w = l.el.offsetWidth; l.h = l.el.offsetHeight; l.x = -1; } };
  measureLabels();
  document.fonts?.ready.then(measureLabels);
  raf = requestAnimationFrame(frame);

  function dispose() {
    cancelAnimationFrame(raf);
    abort.abort(); ro.disconnect(); controls.dispose();
    scene.traverse((o) => { if (o.geometry) disposables.add(o.geometry); const m = o.material; if (m) (Array.isArray(m) ? m : [m]).forEach(x => disposables.add(x)); if (o.isInstancedMesh) o.dispose(); });

    ui.labels.innerHTML = '';
  }

  return {
    focus(id) {
      const d = lmData[id];
      hover.id = null;
      flyTo(viewFor(d.view, false), () => {

    setReduced(v) { if (v) { controls.autoRotate = false; if (tween) { const t = tween; tween = null; controls.target.copy(t.t1); camera.position.setFromSpherical(t.s1).add(t.t1); settleControls(); t.onArrive && t.onArrive(); } } },
    dispose

}

boot();
